version: '3.8'

services:
  whatsapp-bot-1:
    build: .
    container_name: whatsapp-bot-1
    restart: unless-stopped
    environment:
      - INSTANCE_NAME=bot1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      # Persistir sesiones para no tener que escanear el QR en cada reinicio
      - ./sessions:/usr/src/app/sessions

  whatsapp-bot-2:
    build: .
    container_name: whatsapp-bot-2
    restart: unless-stopped
    environment:
      - INSTANCE_NAME=bot2
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./sessions:/usr/src/app/sessions
